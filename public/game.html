<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, maximum-scale=1, minimum-scale=1, user-scalable=no">
    <title>Daily Thaw</title>
    <link rel="modulepreload" href="game.js">
    <style>
      html,body{margin:0;height:100dvh;background:#05080b;overflow:hidden}
      /* center the canvas; DO NOT set its width/height here —
         resize() owns the pixel + CSS dimensions so the coord system matches. */
      body{display:grid;place-items:center}
      #c{display:block;touch-action:none}
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script src="game.js" type="module"></script>
  </body>
</html>
